[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-image-generator"
version = "0.1.0"
description = "Local catalog image prep: background removal + mm dimension overlays"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.4.0",
  "numpy>=1.26.0",
  "click>=8.1.7",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
cig = "catalog_image.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalog_image = ["static/*"]
